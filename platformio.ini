[platformio]
default_envs = esp32dev, esp32-s3-devkitc-1, esp32-c3-devkitm-1, esp32dev-obc, esp32-s3-devkitc-1-obc, esp32-c3-devkitm-1-obc
src_dir = .

[env]
platform = espressif32@6.10.0
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@1.4.2
monitor_speed = 115200
build_src_filter = -<*> +<Di2ToZwiftRide/>

[env:esp32dev]
board = esp32dev

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[obc]
build_src_filter = -<*> +<Di2ToOpenBikeControl/>

[env:esp32dev-obc]
board = esp32dev
build_src_filter = ${obc.build_src_filter}

[env:esp32-s3-devkitc-1-obc]
board = esp32-s3-devkitc-1
build_src_filter = ${obc.build_src_filter}
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c3-devkitm-1-obc]
board = esp32-c3-devkitm-1
build_src_filter = ${obc.build_src_filter}
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
